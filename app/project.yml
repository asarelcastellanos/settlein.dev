name: Settlein
options:
  bundleIdPrefix: dev.settlein
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Settlein
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: dev.settlein.app
    PRODUCT_NAME: Settlein
targets:
  Settlein:
    type: application
    platform: macOS
    sources:
      - Settlein
