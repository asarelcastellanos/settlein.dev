name: Catalog

permissions:
  contents: write

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: catalog-data
          path: data
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Generate catalog
        run: node catalog/generate.mjs catalog/apps.json data/catalog.json
      - name: Commit and push catalog
        working-directory: data
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Rebuild catalog from Homebrew Cask"
          git push origin HEAD:catalog-data
