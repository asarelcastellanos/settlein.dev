name: Checks

permissions:
  contents: read

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check comments
        run: scripts/check-comments.sh "origin/${{ github.base_ref }}"
      - name: Check skills
        run: scripts/check-skills.sh
