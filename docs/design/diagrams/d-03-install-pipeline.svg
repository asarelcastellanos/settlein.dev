<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A90A6"/></marker></defs><rect width="1500" height="700" fill="#FAFBFD"/><text x="40" y="52" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#1A1D2B" text-anchor="start">Mac app · one app through the install pipeline</text><text x="40" y="80" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#545A6E" text-anchor="start">Each app moves through these states on its own row in A2. Up to 3 download at once; installs run one at a time.</text><rect x="40" y="100" width="24" height="16" rx="10" fill="#FFFFFF" stroke="#C9CEDB" stroke-width="1.5" opacity="1"/><text x="52.0" y="113.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="middle"></text><text x="72" y="112" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#545A6E" text-anchor="start">SettleIn screen</text><rect x="190" y="100" width="24" height="16" rx="10" fill="#F1F3FA" stroke="#C9CEDB" stroke-width="1.5" stroke-dasharray="4 3" opacity="1"/><text x="202.0" y="113.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="middle"></text><text x="222" y="112" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#545A6E" text-anchor="start">macOS / browser</text><rect x="340" y="100" width="24" height="16" rx="10" fill="#E3E8FF" stroke="#3A5BEF" stroke-width="1.5" opacity="1"/><text x="352.0" y="113.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="middle"></text><text x="372" y="112" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#545A6E" text-anchor="start">Person acts</text><rect x="490" y="100" width="24" height="16" rx="10" fill="#E8F5EC" stroke="#1A7F37" stroke-width="1.5" opacity="1"/><text x="502.0" y="113.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="middle"></text><text x="522" y="112" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#545A6E" text-anchor="start">Good end</text><rect x="640" y="100" width="24" height="16" rx="10" fill="#FDE8E8" stroke="#C4161C" stroke-width="1.5" opacity="1"/><text x="652.0" y="113.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="middle"></text><text x="672" y="112" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#545A6E" text-anchor="start">Refused / failed</text><rect x="60" y="240" width="160" height="60" rx="10" fill="#FFFFFF" stroke="#C9CEDB" stroke-width="1.5" opacity="1"/><text x="140.0" y="275.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="middle">Waiting</text><rect x="250" y="240" width="160" height="60" rx="10" fill="#FFFFFF" stroke="#C9CEDB" stroke-width="1.5" opacity="1"/><text x="330.0" y="267.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="middle">Downloading</text><text x="330.0" y="285.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#545A6E" text-anchor="middle">progress bar</text><rect x="440" y="240" width="230" height="60" rx="10" fill="#FFFFFF" stroke="#C9CEDB" stroke-width="1.5" opacity="1"/><text x="555.0" y="267.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="middle">Verifying</text><text x="555.0" y="285.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#545A6E" text-anchor="middle">signature · notarization · SHA-256</text><rect x="700" y="240" width="230" height="60" rx="10" fill="#FFFFFF" stroke="#C9CEDB" stroke-width="1.5" opacity="1"/><text x="815.0" y="267.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="middle">Installing</text><text x="815.0" y="285.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#545A6E" text-anchor="middle">copy .app to /Applications</text><rect x="960" y="240" width="200" height="60" rx="10" fill="#E8F5EC" stroke="#1A7F37" stroke-width="1.5" opacity="1"/><text x="1060.0" y="275.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="middle">Done</text><rect x="700" y="360" width="230" height="60" rx="10" fill="#FFF4DC" stroke="#D9A400" stroke-width="1.5" opacity="1"/><text x="815.0" y="387.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="middle">Opened in Apple’s Installer</text><text x="815.0" y="405.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#545A6E" text-anchor="middle">.pkg apps: person finishes</text><rect x="960" y="360" width="200" height="60" rx="10" fill="#E8F5EC" stroke="#1A7F37" stroke-width="1.5" opacity="1"/><text x="1060.0" y="395.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="middle">Done when Installer quits</text><rect x="440" y="420" width="230" height="60" rx="10" fill="#FDE8E8" stroke="#C4161C" stroke-width="1.5" opacity="1"/><text x="555.0" y="447.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="middle">Refused</text><text x="555.0" y="465.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#545A6E" text-anchor="middle">reason shown on the row</text><rect x="250" y="420" width="160" height="60" rx="10" fill="#FDE8E8" stroke="#C4161C" stroke-width="1.5" opacity="1"/><text x="330.0" y="447.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="middle">Download failed</text><text x="330.0" y="465.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#545A6E" text-anchor="middle">retry once, then Refused</text><rect x="60" y="520" width="160" height="60" rx="10" fill="#F1F3FA" stroke="#C9CEDB" stroke-width="1.5" stroke-dasharray="4 3" opacity="1"/><text x="140.0" y="547.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="middle">Cancelled</text><text x="140.0" y="565.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#545A6E" text-anchor="middle">Cancel the rest / removed</text><path d="M220 270 L245 270" stroke="#8A90A6" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M410 270 L435 270" stroke="#8A90A6" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M670 270 L695 270" stroke="#8A90A6" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M930 270 L955 270" stroke="#8A90A6" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M670 285 L685 285 L685 390 L695 390" stroke="#8A5A00" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M930 390 L955 390" stroke="#8A90A6" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M555 300 L555 415" stroke="#C4161C" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M330 300 L330 415" stroke="#C4161C" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><path d="M140 300 L140 515" stroke="#8A90A6" stroke-width="1.5" fill="none" marker-end="url(#ar)" stroke-dasharray="5 4"/><rect x="49.0" y="408" width="182.0" height="18" rx="4" fill="#FAFBFD" opacity="1"/><text x="140" y="421" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#545A6E" text-anchor="middle">cancel / change selection</text><rect x="498.0" y="348" width="114.0" height="18" rx="4" fill="#FAFBFD" opacity="1"/><text x="555" y="361" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#545A6E" text-anchor="middle">any check fails</text><rect x="300.2" y="348" width="59.6" height="18" rx="4" fill="#FAFBFD" opacity="1"/><text x="330" y="361" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#545A6E" text-anchor="middle">network</text><text x="1180" y="240" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">Verification (C12–C14):</text><text x="1180" y="259" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">1. Developer ID signature is valid</text><text x="1180" y="278" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">    (SecStaticCodeCheckValidity)</text><text x="1180" y="297" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">2. Notarization ticket is stapled or online</text><text x="1180" y="316" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">3. SHA-256 matches the catalog</text><text x="1180" y="335" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">    (CryptoKit)</text><text x="1180" y="354" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start"></text><text x="1180" y="373" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">Any failure → Refused. The file is</text><text x="1180" y="392" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">deleted; nothing is installed.</text></svg>