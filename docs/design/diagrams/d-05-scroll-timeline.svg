<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A90A6"/></marker></defs><rect width="1500" height="520" fill="#FAFBFD"/><text x="40" y="52" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#1A1D2B" text-anchor="start">Website · scroll story timeline (desktop, window ≥ 900 × 640)</text><text x="40" y="80" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#545A6E" text-anchor="start">Scroll progress p runs 0 → 1 over a stage 2 × the viewport tall. Values are smoothed toward the target at 0.2 per frame.</text><path d="M120 200 L1400 200" stroke="#1A1D2B" stroke-width="2" fill="none"/><path d="M120 194 L120 206" stroke="#1A1D2B" stroke-width="2" fill="none"/><text x="120" y="226" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1D2B" text-anchor="middle">p = 0</text><path d="M273.6 194 L273.6 206" stroke="#1A1D2B" stroke-width="2" fill="none"/><text x="273.6" y="226" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1D2B" text-anchor="middle">p = 0.12</text><path d="M888.0 194 L888.0 206" stroke="#1A1D2B" stroke-width="2" fill="none"/><text x="888.0" y="226" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1D2B" text-anchor="middle">p = 0.6</text><path d="M1400 194 L1400 206" stroke="#1A1D2B" stroke-width="2" fill="none"/><text x="1400" y="226" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1D2B" text-anchor="middle">p = 1</text><text x="110" y="284" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="end">Hero text</text><rect x="120" y="270" width="384.0" height="20" rx="5" fill="#C9CEDB" opacity="0.85"/><text x="514.0" y="285" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#545A6E" text-anchor="start">fades out and slides 40 px left</text><text x="110" y="336" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="end">Picker contents</text><rect x="120" y="322" width="153.60000000000002" height="20" rx="5" fill="#3A5BEF" opacity="0.85"/><text x="283.6" y="337" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#545A6E" text-anchor="start">fade in</text><text x="110" y="388" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="end">Demo window</text><rect x="120" y="374" width="768.0" height="20" rx="5" fill="#3A5BEF" opacity="0.85"/><text x="898.0" y="389" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#545A6E" text-anchor="start">zooms from hero size to full screen (easeInOutCubic)</text><text x="110" y="440" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A1D2B" text-anchor="end">Full-screen picker</text><rect x="888.0" y="426" width="512.0" height="20" rx="5" fill="#1A7F37" opacity="0.85"/><text x="1410" y="441" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#545A6E" text-anchor="start">held, interactive; page continues to footer</text><text x="120" y="490.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#545A6E" text-anchor="start">Reduce Motion, or a window under 900 × 640: no zoom. The picker is a normal block below the hero (static layout).</text><text x="40" y="480" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="1" font-weight="400" fill="#1A1D2B" text-anchor="start"></text></svg>