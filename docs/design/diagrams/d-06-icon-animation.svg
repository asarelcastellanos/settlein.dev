font-size="13" font-weight="400" fill="#1A1D2B" text-anchor="start">Each tile starts at scale .25 inside the box opening (512, 604), rotated to 0°, and springs to its place with</text><text x="200" y="380" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1A1D2B" text-anchor="start">cubic-bezier(.34, 1.45, .64, 1). Delays 0 / 120 / 240 ms. Total 1140 ms. Reduce Motion: no animation, still icon.</text><text x="200" y="400" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1A1D2B" text-anchor="start">SwiftUI: keyframeAnimator per tile, or .phaseAnimator with a spring(response: 0.55, dampingFraction: 0.62).</text></svg>