<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A90A6"/></marker></defs><rect width="1500" height="470" fill="#FAFBFD"/><text x="40" y="52" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#1A1D2B" text-anchor="start">App icon · animation timeline</text><text x="40" y="80" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#545A6E" text-anchor="start">Plays once (900 ms per tile) on page load and on the Finished screen. Loop version (3.2 s) is for the brand board only.</text><path d="M200.0 150 L200.0 360" stroke="#E3E6EE" stroke-width="1" fill="none"/><text x="200.0" y="140" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#545A6E" text-anchor="middle">0 ms</text><path d="M291.6666666666667 150 L291.6666666666667 360" stroke="#E3E6EE" stroke-width="1" fill="none"/><text x="291.6666666666667" y="140" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#545A6E" text-anchor="middle">100 ms</text><path d="M383.33333333333337 150 L383.33333333333337 360" stroke="#E3E6EE" stroke-width="1" fill="none"/><text x="383.33333333333337" y="140" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#545A6E" text-anchor="middle">200 ms</text><path d="M475.0 150 L475.0 360" stroke="#E3E6EE" stroke-width="1" fill="none"/><text x="475.0" y="140" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#545A6E" text-anchor="middle">300 ms</text><path d="M566.6666666666667 150 L566.6666666666667 360" stroke="#E3E6EE" stroke-width="1" fill="none"/><text x="566.6666666666667" y="140" f