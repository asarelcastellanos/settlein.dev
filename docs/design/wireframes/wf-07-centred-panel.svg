<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A90A6"/></marker></defs><rect width="1100" height="760" fill="#FAFBFD"/><text x="40" y="52" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#1A1D2B" text-anchor="start">Mac app · centred panel (uninstall, cancel, change selection)</text><text x="40" y="80" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#545A6E" text-anchor="start">Never a sheet from the title bar. Always centred over a dimmed window.</text><rect x="60" y="110" width="700" height="580" rx="12" fill="#FFFFFF" stroke="#C9CEDB" stroke-width="1.5" opacity="1"/><path d="M60 140 L760 140" stroke="#C9CEDB" stroke-width="1" fill="none"/><circle cx="76" cy="125" r="5" fill="#FF5F57"/><circle cx="92" cy="125" r="5" fill="#FEBC2E"/><circle cx="108" cy="125" r="5" fill="#28C840"/><text x="410.0" y="130" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1A1D2B" text-anchor="middle">SettleIn</text><rect x="61" y="141" width="698" height="548" rx="0" fill="#0A0F28" opacity="0.22"/><rect x="240" y="260" width="340" height="300" rx="18" fill="#FFFFFF" stroke="#C9CEDB" stroke-width="1.5" opacity="1"/><rect x="380" y="285" width="60" height="60" rx="14" fill="#E3E6EE" opacity="1"/><rect x="300" y="365" width="220" height="18" rx="6" fill="#1A1D2B" opacity="0.85"/><rect x="290" y="400" width="240" height="9" rx="4.5" fill="#C9CEDB" opacity="1"/><rect x="290" y="416" width="200" height="9" rx="4.5" fill="#C9CEDB" opacity="1"/><rect x="270" y="500" width="135" height="34" rx="9" fill="#F4F5F8" stroke="#C9CEDB" stroke-width="1.5" opacity="1"/><rect x="415" y="500" width="135" height="34" rx="9" fill="#D92D2D" opacity="1"/><path d="M410 292 L776 266" stroke="#3A5BEF" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/><circle cx="410" cy="292" r="4" fill="#3A5BEF"/><circle cx="786" cy="265" r="10" fill="#3A5BEF"/><text x="786" y="269" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="802" y="270" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">Icon of the app the panel is about.</text><path d="M400 374 L776 326" stroke="#3A5BEF" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/><circle cx="400" cy="374" r="4" fill="#3A5BEF"/><circle cx="786" cy="325" r="10" fill="#3A5BEF"/><text x="786" y="329" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="802" y="330" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">Title says the action: &quot;Uninstall Slack?&quot;</text><path d="M480 517 L776 396" stroke="#3A5BEF" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/><circle cx="480" cy="517" r="4" fill="#3A5BEF"/><circle cx="786" cy="395" r="10" fill="#3A5BEF"/><text x="786" y="399" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="802" y="400" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">Cancel left, action right. Destructive</text><text x="802" y="418" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">actions are red; Return = Cancel for</text><text x="802" y="436" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">destructive panels. Esc always cancels.</text><path d="M120 180 L776 486" stroke="#3A5BEF" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/><circle cx="120" cy="180" r="4" fill="#3A5BEF"/><circle cx="786" cy="485" r="10" fill="#3A5BEF"/><text x="786" y="489" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="802" y="490" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">Window dims to rgba(10,15,40,.22).</text><text x="802" y="508" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">Panel: ZStack overlay, 340 pt wide,</text><text x="802" y="526" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">spring in 320 ms (fade only with</text><text x="802" y="544" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">Reduce Motion).</text></svg>