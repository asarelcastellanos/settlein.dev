<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A90A6"/></marker></defs><rect width="1000" height="820" fill="#FAFBFD"/><text x="40" y="52" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#1A1D2B" text-anchor="start">Footer pages · How apps are verified, What SettleIn sends, Release notes</text><text x="40" y="80" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#545A6E" text-anchor="start">Sections on the page ground, no white boxes. Heading left, short stacked sentences right.</text><rect x="40" y="110" width="920" height="660" rx="10" fill="#FFFFFF" stroke="#C9CEDB" stroke-width="1.5" opacity="1"/><rect x="120" y="150" width="140" height="12" rx="6" fill="#3A5BEF" opacity="1"/><rect x="120" y="175" width="500" height="36" rx="6" fill="#1A1D2B" opacity="0.85"/><rect x="120" y="230" width="560" height="10" rx="5.0" fill="#C9CEDB" opacity="1"/><rect x="120" y="248" width="420" height="10" rx="5.0" fill="#C9CEDB" opacity="1"/><path d="M120 300 L880 300" stroke="#C9CEDB" stroke-width="1" fill="none"/><rect x="120" y="328" width="190" height="16" rx="6" fill="#1A1D2B" opacity="0.8"/><rect x="380" y="328" width="420" height="9" rx="4.5" fill="#C9CEDB" opacity="1"/><rect x="380" y="350" width="380" height="9" rx="4.5" fill="#C9CEDB" opacity="1"/><rect x="380" y="372" width="440" height="9" rx="4.5" fill="#C9CEDB" opacity="1"/><path d="M120 440 L880 440" stroke="#C9CEDB" stroke-width="1" fill="none"/><rect x="120" y="468" width="190" height="16" rx="6" fill="#1A1D2B" opacity="0.8"/><rect x="380" y="468" width="420" height="9" rx="4.5" fill="#C9CEDB" opacity="1"/><rect x="380" y="490" width="380" height="9" rx="4.5" fill="#C9CEDB" opacity="1"/><rect x="380" y="512" width="440" height="9" rx="4.5" fill="#C9CEDB" opacity="1"/><path d="M120 580 L880 580" stroke="#C9CEDB" stroke-width="1" fill="none"/><rect x="120" y="608" width="190" height="16" rx="6" fill="#1A1D2B" opacity="0.8"/><rect x="380" y="608" width="420" height="9" rx="4.5" fill="#C9CEDB" opacity="1"/><rect x="380" y="630" width="380" height="9" rx="4.5" fill="#C9CEDB" opacity="1"/><rect x="380" y="652" width="440" height="9" rx="4.5" fill="#C9CEDB" opacity="1"/><path d="M200 156 L626 156" stroke="#3A5BEF" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/><circle cx="200" cy="156" r="4" fill="#3A5BEF"/><circle cx="636" cy="155" r="10" fill="#3A5BEF"/><text x="636" y="159" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="652" y="160" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">Eyebrow, title, one-line intro.</text><path d="M215 336 L626 326" stroke="#3A5BEF" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/><circle cx="215" cy="336" r="4" fill="#3A5BEF"/><circle cx="636" cy="325" r="10" fill="#3A5BEF"/><text x="636" y="329" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="652" y="330" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">Section heading, 2-column grid</text><text x="652" y="348" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">(stacks under 760 px).</text><path d="M600 350 L626 416" stroke="#3A5BEF" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/><circle cx="600" cy="350" r="4" fill="#3A5BEF"/><circle cx="636" cy="415" r="10" fill="#3A5BEF"/><text x="636" y="419" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="652" y="420" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">One sentence per line. No cards,</text><text x="652" y="438" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A1D2B" text-anchor="start">no pills, no white panels.</text></svg>